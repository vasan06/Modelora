<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Console — Modelora V5</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030508;font-family:'DM Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#00e5a0}
/* Grid background */
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,160,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,.04) 1px,transparent 1px);background-size:40px 40px;z-index:0;animation:gridPulse 4s ease-in-out infinite}
@keyframes gridPulse{0%,100%{opacity:.5}50%{opacity:1}}
/* Scanlines */
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);z-index:1;pointer-events:none}
/* Corner marks */
.corner{position:fixed;width:32px;height:32px;z-index:2;opacity:.4}
.corner.tl{top:20px;left:20px;border-top:2px solid #00e5a0;border-left:2px solid #00e5a0}
.corner.tr{top:20px;right:20px;border-top:2px solid #00e5a0;border-right:2px solid #00e5a0}
.corner.bl{bottom:20px;left:20px;border-bottom:2px solid #00e5a0;border-left:2px solid #00e5a0}
.corner.br{bottom:20px;right:20px;border-bottom:2px solid #00e5a0;border-right:2px solid #00e5a0}
/* Status blips */
.blip{position:fixed;z-index:2;font-size:10px;opacity:.5;letter-spacing:.08em}
.blip1{top:24px;left:60px}.blip2{top:24px;right:60px;text-align:right}.blip3{bottom:24px;left:60px}.blip4{bottom:24px;right:60px;text-align:right}
/* Main */
.wrap{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
/* Shield logo */
.shield-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.shield-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,229,160,.15);animation:shieldSpin 8s linear infinite}
.shield-ring2{position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(0,229,160,.1);animation:shieldSpin 12s linear infinite reverse}
@keyframes shieldSpin{to{transform:rotate(360deg)}}
.shield-icon{width:80px;height:80px;background:rgba(0,229,160,.06);border:1px solid rgba(0,229,160,.2);border-radius:16px;display:flex;align-items:center;justify-content:center;animation:shieldPulse 2.5s ease-in-out infinite}
@keyframes shieldPulse{0%,100%{box-shadow:0 0 20px rgba(0,229,160,.2)}50%{box-shadow:0 0 40px rgba(0,229,160,.4),0 0 60px rgba(0,229,160,.1)}}
/* Title */
.admin-title{font-family:'DM Sans',sans-serif;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.3px;animation:aSlide .6s .3s both}
.admin-title span{color:#00e5a0}
.admin-sub{font-size:11px;color:#3a6050;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;animation:aSlide .5s .5s both}
@keyframes aSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Terminal log */
.terminal{margin-top:24px;width:360px;background:rgba(0,229,160,.03);border:1px solid rgba(0,229,160,.1);border-radius:10px;padding:14px 16px;text-align:left;animation:aSlide .5s .7s both}
.term-bar{display:flex;gap:6px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(0,229,160,.08)}
.term-dot{width:10px;height:10px;border-radius:50%;background:rgba(0,229,160,.3)}
.term-dot:nth-child(2){background:rgba(255,183,0,.3)}.term-dot:nth-child(3){background:rgba(255,77,109,.3)}
.log-line{font-size:10px;line-height:2;opacity:0;animation:logAppear .3s ease forwards}
.log-line:nth-child(2){animation-delay:.9s}
.log-line:nth-child(3){animation-delay:1.3s}
.log-line:nth-child(4){animation-delay:1.7s}
.log-line:nth-child(5){animation-delay:2.1s}
@keyframes logAppear{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.log-ok{color:#00e5a0}.log-warn{color:#ffb700}.log-info{color:#5878a0}
/* Progress bar */
.prog-wrap{margin-top:18px;width:360px;animation:aSlide .4s .8s both}
.prog-label{display:flex;justify-content:space-between;font-size:10px;color:#3a6050;margin-bottom:6px;letter-spacing:.06em}
.prog-track{height:3px;background:rgba(0,229,160,.08);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#00e5a0,#00d4ff);border-radius:2px;width:0;animation:progRun 1.8s 1s ease forwards}
@keyframes progRun{from{width:0}to{width:100%}}
.prog-pct{font-size:10px;color:#00e5a0;margin-top:5px;font-family:'DM Mono',monospace}
/* Cursor blink */
.cursor{display:inline-block;width:7px;height:12px;background:#00e5a0;animation:curBlink .7s infinite;vertical-align:middle;margin-left:2px}
@keyframes curBlink{0%,100%{opacity:1}50%{opacity:0}}
.splash-fade{animation:sFade .5s ease forwards}
@keyframes sFade{to{opacity:0;filter:blur(4px);transform:scale(.98)}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanlines"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="blip blip1">SYS:ONLINE</div>
<div class="blip blip2">AUTH:SECURE</div>
<div class="blip blip3">VER:5.0.0</div>
<div class="blip blip4">UPTIME:99.9%</div>

<div class="wrap" id="splash">
  <div class="shield-wrap">
    <div class="shield-ring"></div>
    <div class="shield-ring2"></div>
    <div class="shield-icon">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4" stroke="#00e5a0" stroke-width="1.8"/>
      </svg>
    </div>
  </div>
  <div class="admin-title">Admin <span>Console</span></div>
  <div class="admin-sub">Modelora V5 — Control Panel</div>
  <div class="terminal">
    <div class="term-bar"><div class="term-dot"></div><div class="term-dot"></div><div class="term-dot"></div></div>
    <div class="log-line log-info">$ Initialising secure connection...</div>
    <div class="log-line" style="color:#00e5a0">[OK] MongoDB: connected (admin_store)</div>
    <div class="log-line" style="color:#00e5a0">[OK] Session manager: active</div>
    <div class="log-line" style="color:#ffb700">[..] Loading audit log module...</div>
    <div class="log-line" style="color:#00e5a0">[OK] Admin panel: authorised <span class="cursor"></span></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-label"><span>LOADING ADMIN MODULES</span><span id="pct">0%</span></div>
    <div class="prog-track"><div class="prog-fill"></div></div>
  </div>
</div>

<script>
// Animate percentage counter
let p = 0;
const pctEl = document.getElementById('pct');
const timer = setInterval(() => {
  p = Math.min(p + Math.floor(Math.random() * 8 + 4), 100);
  pctEl.textContent = p + '%';
  if (p >= 100) clearInterval(timer);
}, 80);

// Redirect after animation
setTimeout(() => {
  document.getElementById('splash').classList.add('splash-fade');
  const token = localStorage.getItem('ml_token');
  setTimeout(() => {
    window.location.href = token ? '/admin' : '/login';
  }, 500);
}, 2800);
</script>
</body>
</html>
